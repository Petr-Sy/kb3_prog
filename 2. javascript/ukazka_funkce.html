<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funkce</title>
</head>
<body>
    <p id="jmeno"></p>

    <script>
        function kvadraticka(x) {
            return 35*x*x + 2;
        }

        function soucet(a, b) {
            return a + b;
        }

        function vypisPozdrav(jmeno) {
            document.getElementById("jmeno").innerHTML
                = "Ahoj " + jmeno;
        }

        document.write(kvadraticka(5) + "<br>");
        document.write(soucet(5, 6) + "<br>");
        document.write(soucet(12, 25) + "<br>");
        vypisPozdrav("Marek");
    </script>
</body>
</html>
